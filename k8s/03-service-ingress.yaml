apiVersion: v1
kind: Service
metadata:
  name: tasky
  namespace: tasky
  annotations:
    cloud.google.com/neg: '{"ingress": true}' # container-native load balancing
spec:
  type: ClusterIP
  selector:
    app: tasky
  ports:
    - port: 80
      targetPort: 8080
---
# Ingress GKE -> crea un Google Cloud HTTP(S) Load Balancer esterno con IP pubblico
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tasky
  namespace: tasky
  annotations:
    kubernetes.io/ingress.class: "gce"
spec:
  defaultBackend:
    service:
      name: tasky
      port:
        number: 80
