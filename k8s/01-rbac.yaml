# DEBOLEZZA INTENZIONALE: il service account dell'applicazione ha cluster-admin.
# Chi compromette il container (RCE nell'app) controlla l'intero cluster:
# puo' leggere tutti i Secret, creare pod privilegiati, ecc.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasky
  namespace: tasky
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasky-cluster-admin
subjects:
  - kind: ServiceAccount
    name: tasky
    namespace: tasky
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
