# =============================================================================
# Pipeline 1 - Infrastructure as Code (Terraform)
#   PR      : scansione IaC (Checkov) + fmt/validate + plan
#   main    : scansione + plan + apply (dietro approvazione dell'environment)
#   manuale : apply o destroy
# Autenticazione a GCP via Workload Identity Federation (OIDC): nessuna chiave.
# =============================================================================
name: IaC - Terraform

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/iac.yml"]
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/iac.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "apply o destroy"
        type: choice
        options: [apply, destroy]
        default: apply

permissions: {} # nessun permesso di default: ogni job dichiara i suoi

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION }}
  TF_VAR_zone: ${{ vars.GCP_ZONE }}
  TF_VAR_alert_email: ${{ vars.ALERT_EMAIL }}
  TF_VAR_enable_org_policies: ${{ vars.ENABLE_ORG_POLICIES || 'false' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  WORKDIR: terraform

jobs:
  iac-scan:
    name: Scansione IaC (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # il token non resta nella cartella del repo

      # soft_fail: le misconfigurazioni sono VOLUTE dall'esercizio, quindi la
      # pipeline le rileva e le pubblica senza bloccare. In un contesto reale
      # si imposta soft_fail: false per bloccare il deploy.
      - name: Checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12
        with:
          directory: . # dalla radice: i percorsi nel SARIF corrispondono ai file del repo
          framework: terraform
          soft_fail: true
          output_format: cli,sarif
          output_file_path: console,checkov.sarif

      - name: Upload risultati in GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: checkov.sarif
          category: checkov-iac

  plan:
    name: Terraform plan
    needs: iac-scan
    if: github.event_name != 'workflow_dispatch' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC verso GCP
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # il token non resta nella cartella del repo

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IAC_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - run: terraform fmt -check -recursive
      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform validate
      - run: terraform plan -input=false -out=tfplan

      # Il piano contiene i valori dei segreti: va nel bucket privato dello
      # state, non negli artifact di GitHub (scaricabili su un repo pubblico).
      - name: Salva il piano nel bucket privato
        if: github.event_name != 'pull_request'
        run: gcloud storage cp tfplan "gs://$TF_STATE_BUCKET/plans/$GITHUB_RUN_ID/tfplan"

  apply:
    name: Terraform apply
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.action == 'apply')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production # configura i "required reviewers" per l'approvazione manuale
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # il token non resta nella cartella del repo

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IAC_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"

      # Applica esattamente il piano generato (e approvato) in questo run
      - name: Recupera il piano
        run: gcloud storage cp "gs://$TF_STATE_BUCKET/plans/$GITHUB_RUN_ID/tfplan" tfplan
      - run: terraform apply -input=false tfplan
      - name: Cancella il piano dal bucket
        if: always()
        run: gcloud storage rm "gs://$TF_STATE_BUCKET/plans/$GITHUB_RUN_ID/tfplan"
      - run: terraform output

  destroy:
    name: Terraform destroy
    needs: iac-scan
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # il token non resta nella cartella del repo

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_IAC_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - id: gke
        continue-on-error: true # il cluster potrebbe non esistere piu'
        uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: wiz-gke
          location: ${{ vars.GCP_ZONE }}

      # Load balancer e NEG li crea Kubernetes, non Terraform: se restano,
      # la VPC risulta in uso e il destroy fallisce (e continuano i costi).
      - name: Rimuovi le risorse create da Kubernetes
        if: steps.gke.outcome == 'success'
        run: |
          kubectl delete namespace tasky --ignore-not-found --timeout=600s
          for _ in $(seq 1 30); do
            negs=$(gcloud compute network-endpoint-groups list --filter="network~wiz-vpc" --format="value(name)")
            [ -z "$negs" ] && exit 0
            echo "In attesa della rimozione dei NEG: $negs"
            sleep 20
          done
          echo "::warning::NEG ancora presenti dopo 10 minuti"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - run: terraform init -input=false -backend-config="bucket=$TF_STATE_BUCKET"
      - run: terraform destroy -input=false -auto-approve
