# =============================================================================
# Pipeline 2 - Applicazione
#   build immagine -> verifica wizexercise.txt -> lint Dockerfile -> scan Trivy
#   -> scan malware ClamAV
#   -> push su Artifact Registry -> deploy su GKE
# =============================================================================
name: App - Build & Deploy

on:
  pull_request:
    paths: ["app/**", "k8s/**", ".github/workflows/app.yml"]
  push:
    branches: [main]
    paths: ["app/**", "k8s/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions: {} # nessun permesso di default: ogni job dichiara i suoi

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION }}
  ZONE: ${{ vars.GCP_ZONE }}
  CLUSTER: wiz-gke
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/wiz-apps/tasky
  LOCAL_IMAGE: tasky:ci

jobs:
  build:
    name: Build, scan & push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # il token non resta nella cartella del repo

      - id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: error

      # Tag locale: build e scansioni non dipendono dalla configurazione GCP
      - name: Build immagine
        run: docker build -t "$LOCAL_IMAGE" app

      - name: Verifica wizexercise.txt nell'immagine
        run: |
          docker run --rm --entrypoint cat "$LOCAL_IMAGE" /app/wizexercise.txt

      - name: Scan immagine (Trivy) - report SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload risultati in GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # Gate: blocca se ci sono CRITICAL con fix disponibile.
      # Disattivabile con la variabile di repo TRIVY_GATE=false (l'app d'esempio
      # usa dipendenze Go datate: decidere in base al risultato della prima run).
      - name: Gate vulnerabilita' critiche
        if: vars.TRIVY_GATE != 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.LOCAL_IMAGE }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Antivirus sui file dell'immagine: Trivy cerca CVE, ClamAV cerca malware
      # noto (binari trojan, webshell, miner). Il filesystem dell'immagine viene
      # estratto e scansionato da un container ClamAV, che aggiorna le firme
      # all'avvio. Exit code di clamscan: 0 pulito, 1 malware trovato, 2 errore.
      - name: Scan malware (ClamAV)
        run: |
          mkdir -p rootfs
          cid=$(docker create "$LOCAL_IMAGE")
          docker export "$cid" | sudo tar -x -C rootfs --exclude='dev/*'
          docker rm "$cid" > /dev/null
          set +e # serve per leggere l'exit code e scrivere comunque il riepilogo
          docker run --rm -v "$PWD/rootfs:/scandir:ro" clamav/clamav:stable \
            sh -c 'freshclam --quiet || true; clamscan -r -i --max-filesize=200M --max-scansize=500M /scandir' \
            | tee clamav.log
          rc=${PIPESTATUS[0]}
          { echo '### ClamAV'; echo '```'; tail -n 12 clamav.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Auth GCP
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APP_SA }}

      - name: Push su Artifact Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image }}
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker tag "$LOCAL_IMAGE" "$IMAGE_REF"
          docker push "$IMAGE_REF"

  deploy:
    name: Deploy su GKE
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # il token non resta nella cartella del repo

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_APP_SA }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - uses: google-github-actions/get-gke-credentials@3da1e46a907576cefaa90c484278bb5b259dd395 # v3.0.0
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      - name: Namespace e RBAC
        run: kubectl apply -f k8s/00-namespace.yaml -f k8s/01-rbac.yaml

      - name: Secret K8s da Secret Manager
        run: |
          MONGODB_URI=$(gcloud secrets versions access latest --secret=mongodb-uri)
          SECRET_KEY=$(gcloud secrets versions access latest --secret=app-jwt-secret)
          echo "::add-mask::$MONGODB_URI"
          echo "::add-mask::$SECRET_KEY"
          kubectl create secret generic tasky-secrets -n tasky \
            --from-literal=MONGODB_URI="$MONGODB_URI" \
            --from-literal=SECRET_KEY="$SECRET_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy
        env:
          IMAGE_REF: ${{ needs.build.outputs.image }}
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE_REF|" k8s/02-deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/03-service-ingress.yaml
          kubectl rollout status deployment/tasky -n tasky --timeout=300s

      - name: Verifica
        run: |
          kubectl get pods,svc,ingress -n tasky -o wide
          kubectl exec -n tasky deploy/tasky -- cat /app/wizexercise.txt
