# =============================================================================
# Controlli di sicurezza sul repository
#   - CodeQL    : SAST sul codice Go
#   - TruffleHog: segreti committati, verificati contro il servizio (solo attivi)
# =============================================================================
name: Repo Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {} # nessun permesso di default: ogni job dichiara i suoi

jobs:
  codeql:
    name: CodeQL (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # il token non resta nella cartella del repo
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: go
      - uses: github/codeql-action/autobuild@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          working-directory: app
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4

  # TruffleHog prova i segreti trovati contro il servizio (es. API di GitHub o
  # GCP) e fallisce solo se la credenziale e' ANCORA ATTIVA: pochi falsi positivi.
  # Push/PR: scansiona i commit nuovi. Schedule/manuale: tutta la storia.
  # I risultati compaiono come annotazioni nel riepilogo della run di Actions.
  trufflehog:
    name: Segreti attivi (TruffleHog)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # il token non resta nella cartella del repo
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          version: 3.99.8
          extra_args: --results=verified
