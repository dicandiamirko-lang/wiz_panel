  <text x="58" y="449.96" font-size="12" fill="#3C4043">2. terraform plan</text>
  <text x="58" y="467.96" font-size="12" fill="#137333">3. approvazione manuale</text>
  <text x="58" y="485.96" font-size="12" fill="#3C4043">4. apply del piano salvato</text>
