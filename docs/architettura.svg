  <text x="58" y="560.12" font-size="14" font-weight="700" fill="#202124">Pipeline App · app.yml</text>
  <text x="58" y="578.96" font-size="12" fill="#137333">1. Hadolint – lint Dockerfile</text>
  <text x="58" y="596.96" font-size="12" fill="#3C4043">2. build immagine</text>
  <text x="58" y="614.96" font-size="12" fill="#3C4043">3. verifica wizexercise.txt</text>
  <text x="58" y="632.96" font-size="12" fill="#137333">4. Trivy – blocca CVE critiche</text>
  <text x="58" y="650.96" font-size="12" fill="#137333">5. ClamAV – blocca malware</text>
  <text x="58" y="668.96" font-size="12" fill="#3C4043">6. push su Artifact Registry</text>
  <text x="58" y="686.96" font-size="12" fill="#3C4043">7. Secret K8s da Secret Manager</text>
  <text x="58" y="704.96" font-size="12" fill="#3C4043">8. deploy su GKE + cert HTTPS</text>
  <text x="58" y="721.88" font-size="11" fill="#5F6368">CI/CD autenticata a GCP via OIDC</text>
